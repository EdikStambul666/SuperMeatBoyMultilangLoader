
name: Build Super Meat Boy Loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.0 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages

      - name: Build x86 Release
        shell: cmd
        run: |
          msbuild src\SuperMeatBoyMultilangLoader.csproj /p:Configuration=Release /p:Platform=x86 /p:FrameworkPathOverride="%GITHUB_WORKSPACE%\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SuperMeatBoyMultilangLoader
          path: src/bin/Release/*.exe
